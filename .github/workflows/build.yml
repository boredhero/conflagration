name: build

on:
  push:
    branches: [master, develop]
    tags: ['v*']
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: MC ${{ matrix.minecraft }} (NeoForge ${{ matrix.neoforge }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.21.1 is the reference target: verified against a real server.
          - minecraft: '1.21.1'
            neoforge: '21.1.248'
            mc_range: '[1.21.1,1.21.2)'
            nf_range: '[21.1,21.2)'
          # Newer branches are best-effort. Mojang changed fire gamerules from 1.21.5
          # onward, so behaviour there is not identical even when it compiles.
          - minecraft: '1.21.4'
            neoforge: '21.4.157'
            mc_range: '[1.21.4,1.21.5)'
            nf_range: '[21.4,21.5)'
          - minecraft: '1.21.8'
            neoforge: '21.8.54'
            mc_range: '[1.21.8,1.21.9)'
            nf_range: '[21.8,21.9)'

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches ~/.gradle (wrapper dists, dependency modules, build cache).
      # Only branches we actually publish from are allowed to write the cache,
      # so a PR cannot poison it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

      # ModDevGradle materialises a decompiled+recompiled Minecraft into a
      # project-local directory. That step is by far the slowest part of a cold
      # build, and ~/.gradle caching does not cover it, so cache it separately
      # per Minecraft/NeoForge version.
      - name: Cache ModDevGradle artifacts
        uses: actions/cache@v6
        with:
          path: build/moddev
          key: moddev-${{ runner.os }}-${{ matrix.minecraft }}-${{ matrix.neoforge }}-${{ hashFiles('build.gradle', 'gradle.properties') }}
          restore-keys: |
            moddev-${{ runner.os }}-${{ matrix.minecraft }}-${{ matrix.neoforge }}-
            moddev-${{ runner.os }}-${{ matrix.minecraft }}-

      # Note the quoting: the version ranges contain '[' and ')', which bash
      # treats as syntax if the argument is left bare.
      # 'build' already depends on 'check' -> 'test', so this runs the unit
      # tests and produces the jar in a single configuration pass.
      - name: Build and test
        run: >-
          ./gradlew build
          "-Pminecraft_version=${{ matrix.minecraft }}"
          "-Pminecraft_version_range=${{ matrix.mc_range }}"
          "-Pneoforge_version=${{ matrix.neoforge }}"
          "-Pneoforge_version_range=${{ matrix.nf_range }}"
          --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report-${{ matrix.minecraft }}
          path: build/reports/tests/test/
          if-no-files-found: ignore

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: conflagration-${{ matrix.minecraft }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect jars
        run: |
          mkdir -p release
          find artifacts -name '*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          ls -lh release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.jar
          generate_release_notes: true
          draft: false
